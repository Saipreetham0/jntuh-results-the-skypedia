services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: jntuh-results-app:latest
    container_name: jntuh-results-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://jntuhresults.theskypedia.com
      - PORT=3000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 450M
        reservations:
          memory: 128M
